<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ESP Viewer</title>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; top: 8px; left: 8px; color: #0f0; font: 12px monospace; z-index: 10; }
  </style>
</head>
<body>
  <div id="hud">connecting...</div>
  <canvas id="c" width="1280" height="720"></canvas>
  
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const hud = document.getElementById('hud');

    // Resize canvas to full screen
    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Poll the server 5 times a second
    setInterval(async () => {
      try {
        const res = await fetch('/view');
        const data = await res.json();
        
        hud.textContent = `Connected • Entities: ${data.entities.length}`;
        
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.strokeStyle = '#0f0';
        ctx.fillStyle = '#0f0';
        ctx.font = '12px monospace';

        for (const e of data.entities) {
          const x = e.pos?.x ?? 0;
          const y = e.pos?.y ?? 0;
          ctx.strokeRect(x - 20, y - 40, 40, 80);
          ctx.fillText(`#${e.id} hp:${e.health}`, x - 20, y - 45);
        }
      } catch (e) {
        hud.textContent = "Error connecting to server";
      }
    }, 200);
  </script>
</body>
</html>
